[workspace]
resolver = "3"
members = ["crates/quire-core", "crates/quire-syntax", "crates/egui_quire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/akiselev/quire"
publish = false

[workspace.dependencies]
quire-core = { path = "crates/quire-core" }
quire-syntax = { path = "crates/quire-syntax" }
egui_quire = { path = "crates/egui_quire" }
ropey = "1.6.1"
smallvec = "1.13"
egui = "=0.37.0"
egui_kittest = "=0.37.0"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
