[workspace]
resolver = "3"
members = ["crates/quire-core", "crates/quire-syntax", "crates/egui_quire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/akiselev/quire"
publish = false

[workspace.dependencies]
quire-core = { path = "crates/quire-core" }
quire-syntax = { path = "crates/quire-syntax" }
egui_quire = { path = "crates/egui_quire" }
# Only LF is a line break inside quire (Text normalises CR/CRLF on load).
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
imara-diff = "0.2"
unicode-segmentation = "1.12"
# Language rules (onEnter, indentation) are JavaScript-flavoured regexes with lookaround and
# backreferences; fancy-regex adds those on top of regex-automata.
fancy-regex = "0.19"
regex-automata = { version = "0.4.18", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "nfa", "dfa", "hybrid"] }
serde = { version = "1", features = ["derive", "rc"] }
schemars = "1"
smallvec = "1.13"
egui = { version = "=0.37.0", default-features = false }
egui_kittest = "=0.37.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "wayland", "x11"] }
serde_json = "1"
proptest = "1"
criterion = { version = "0.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
