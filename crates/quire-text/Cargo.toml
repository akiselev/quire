[package]
name = "quire-text"
description = "The shared text-editing core of quire: text, change sets, selections, transactions, history, word rules and field commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## `ChangeSet::diff` (imara-diff); quire-core enables it, fields do not.
diff = ["dep:imara-diff"]
## serde derives for selections, versions, origins and rules.
serde = ["dep:serde", "smallvec/serde"]
## JSON schemas (implies serde).
schemars = ["serde", "dep:schemars"]

# No egui, no tokio, no threads, no regex, no clock; must build for wasm32-unknown-unknown.
[dependencies]
ropey.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
unicode-general-category.workspace = true
imara-diff = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
stats_alloc.workspace = true
criterion.workspace = true
quire-text = { path = ".", features = ["serde", "diff"] }

[[bench]]
name = "field"
harness = false

[[bench]]
name = "lines"
harness = false

[lints]
workspace = true
