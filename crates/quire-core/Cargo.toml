[package]
name = "quire-core"
description = "Headless text model, change sets, transactions, selection and history for the quire code editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## serde derives for commands, config, selections, diagnostics and versions.
serde = ["dep:serde", "smallvec/serde"]
## JSON schemas for `EditorCommand` and `EditorConfig` (implies serde).
schemars = ["serde", "dep:schemars"]

# No egui, no tokio, no threads; must build for wasm32-unknown-unknown.
[dependencies]
ropey.workspace = true
smallvec.workspace = true
imara-diff.workspace = true
regex-automata.workspace = true
fancy-regex.workspace = true
unicode-segmentation.workspace = true
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
serde_json.workspace = true
quire-core = { path = ".", features = ["serde"] }

[[bench]]
name = "e2"
harness = false

[lints]
workspace = true
