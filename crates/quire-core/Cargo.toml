[package]
name = "quire-core"
description = "Headless text model, change sets, transactions, selection and history for the quire code editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
## serde derives for commands, config, selections, diagnostics and versions.
serde = ["dep:serde", "smallvec/serde", "quire-text/serde"]
## JSON schemas for `EditorCommand` and `EditorConfig` (implies serde).
schemars = ["serde", "dep:schemars", "quire-text/schemars"]

# No egui, no tokio, no threads; must build for wasm32-unknown-unknown.
[dependencies]
quire-text = { workspace = true, features = ["diff"] }
smallvec.workspace = true
regex-automata.workspace = true
fancy-regex.workspace = true
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
serde_json.workspace = true
quire-core = { path = ".", features = ["serde"] }

[[bench]]
name = "e2"
harness = false

[lints]
workspace = true
