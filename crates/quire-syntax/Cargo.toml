[package]
name = "quire-syntax"
description = "tree-sitter highlighters (Svelte, TypeScript, JavaScript, CSS) for the quire code editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["svelte", "typescript", "javascript", "css"]
# One feature per grammar: each is a C build. Svelte injects JS/TS/CSS, so it pulls them in.
svelte = ["dep:tree-sitter-htmlx-svelte", "javascript", "typescript", "css"]
typescript = ["dep:tree-sitter-typescript"]
javascript = ["dep:tree-sitter-javascript"]
css = ["dep:tree-sitter-css"]
# SyntaxDriver (debounced background parse jobs); its public API awaits approval.
unstable-driver = []

[dependencies]
quire-core.workspace = true
# 0.26, not 0.27: tree-sitter-htmlx-svelte depends on tree-sitter ^0.26 (docs/design/E5.md).
tree-sitter = "0.26.13"
streaming-iterator = "0.1.9"
tree-sitter-htmlx-svelte = { version = "0.1.16", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }

[lints]
workspace = true
