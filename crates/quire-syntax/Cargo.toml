[package]
name = "quire-syntax"
description = "tree-sitter highlighters (Svelte, TypeScript, JavaScript, CSS) for the quire code editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["svelte", "typescript", "javascript", "css"]
# One feature per grammar: each is a C build. Svelte injects JS/TS/CSS, so it pulls them in.
svelte = ["dep:tree-sitter-svelte-ng", "javascript", "typescript", "css"]
typescript = ["dep:tree-sitter-typescript"]
javascript = ["dep:tree-sitter-javascript"]
css = ["dep:tree-sitter-css"]

[dependencies]
quire-core.workspace = true
tree-sitter = "0.27.1"
streaming-iterator = "0.1.9"
tree-sitter-svelte-ng = { version = "1.0.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }

[lints]
workspace = true
