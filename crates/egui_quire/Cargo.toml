[package]
name = "egui_quire"
description = "The quire code editor widget for egui 0.37"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
quire-core = { workspace = true, features = ["serde"] }
egui = { workspace = true, features = ["default_fonts"] }
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# Host-side syntax highlighting in the playground and the integration kittest; the widget itself
# reads tokens and folds from the Document only.
quire-syntax.workspace = true
eframe.workspace = true

# Snapshot images render through wgpu (Metal); they are recorded and compared on macOS only, as
# other backends (lavapipe, GL) rasterise differently.
[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[[example]]
name = "playground"

[lints]
workspace = true
